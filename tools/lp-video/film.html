<style>*{box-sizing:border-box}html,body{margin:0;background:#10192a;overflow:hidden}canvas{display:block;width:1920px;height:1080px}</style>
<canvas id="film" width="1920" height="1080"></canvas>
<script>
const c=document.querySelector('canvas'),x=c.getContext('2d');
const W=1920,H=1080,INK='#152233',BLUE='#3267ec',MINT='#a9eadc',CREAM='#f5f4ef',MUTED='#8391a4';
const img={};let story=[];
const clamp=(n,a=0,b=1)=>Math.max(a,Math.min(b,n));
const ease=t=>1-Math.pow(1-clamp(t),3);
function box(a,b,w,h,r=24,fill='#fff',stroke){x.beginPath();x.roundRect(a,b,w,h,r);if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.lineWidth=2;x.stroke()}}
function text(s,a,b,size=48,color=INK,weight=600,align='left'){x.fillStyle=color;x.font=`${weight} ${size}px "Hiragino Sans", "Noto Sans JP", sans-serif`;x.textAlign=align;x.textBaseline='middle';x.fillText(s,a,b)}
function line(a,b,d,e,color=BLUE,width=3){x.beginPath();x.moveTo(a,b);x.lineTo(d,e);x.strokeStyle=color;x.lineWidth=width;x.stroke()}
function circle(a,b,r,color){x.beginPath();x.arc(a,b,r,0,Math.PI*2);x.fillStyle=color;x.fill()}
function alpha(n,fn){x.save();x.globalAlpha=clamp(n);fn();x.restore()}
function shift(dx,dy,fn){x.save();x.translate(dx,dy);fn();x.restore()}
function imageFit(im,a,b,w,h,cover=false){if(!im)return;const scale=cover?Math.max(w/im.width,h/im.height):Math.min(w/im.width,h/im.height);const iw=im.width*scale,ih=im.height*scale;x.drawImage(im,a+(w-iw)/2,b+(h-ih)/2,iw,ih)}
function bg(dark=false,t=0){x.fillStyle=dark?INK:CREAM;x.fillRect(0,0,W,H);let g=x.createRadialGradient(1550,260,0,1550,260,1000);g.addColorStop(0,dark?'#223753':'#e4eeff');g.addColorStop(1,dark?INK:CREAM);x.fillStyle=g;x.fillRect(0,0,W,H);for(let i=0;i<15;i++){alpha(.07,()=>circle(100+i*145,130+Math.sin(t*.18+i)*70,2,dark?'#fff':BLUE))}}
function brand(dark=false,label=''){text('it-learning-app',90,65,26,dark?'#fff':INK,700);text(label,1830,65,21,dark?'#9baabd':'#6b7888',500,'right');}
function smallLabel(s,a=105,b=220,dark=false){text(s,a,b,25,dark?MINT:BLUE,600)}
function title(lines,a,b,size=76,color=INK,gap=110){lines.forEach((s,i)=>text(s,a,b+i*gap,size,color,700))}
function pill(s,a,b,w,fill=BLUE,color='#fff'){box(a,b,w,58,29,fill);text(s,a+w/2,b+29,25,color,600,'center')}
function device(im,a,b,w,h,sy=0,sh=1000,sx=240,sw=1200){x.save();x.shadowColor='#14213625';x.shadowBlur=45;x.shadowOffsetY=20;box(a,b,w,h,23,'#fff');x.restore();x.save();x.beginPath();x.roundRect(a,b,w,h,23);x.clip();if(im)x.drawImage(im,sx,sy,sw,sh,a,b,w,h);x.restore();box(a,b,w,h,23,null,'#dbe2eb')}
function arrow(a,b,d,e,color=BLUE){line(a,b,d,e,color,4);const angle=Math.atan2(e-b,d-a);line(d,e,d-14*Math.cos(angle-.5),e-14*Math.sin(angle-.5),color,4);line(d,e,d-14*Math.cos(angle+.5),e-14*Math.sin(angle+.5),color,4)}
function sub(t){const s=story.find(v=>t>=v.start&&t<=v.end);if(!s)return;let parts=[s.text];x.font='500 31px "Hiragino Sans"';if(x.measureText(s.text).width>1710){let mid=Math.floor(s.text.length/2);let k=s.text.indexOf('、',mid-8);if(k<0||k>mid+10)k=mid;parts=[s.text.slice(0,k+1),s.text.slice(k+1)]}const h=parts.length*43+30;box(70,1050-h,1780,h,15,'#0b152bee');parts.forEach((p,i)=>text(p,960,1050-h+34+i*43,31,'#fff',500,'center'))}
function opening(t){bg(true,t);x.save();const z=1+t*.003;x.translate(1920*(1-z),1080*(1-z));x.scale(z,z);imageFit(img.student,0,0,W,H,true);x.restore();let g=x.createLinearGradient(0,0,1450,0);g.addColorStop(0,'#081523d9');g.addColorStop(.55,'#08152366');g.addColorStop(1,'#08152300');x.fillStyle=g;x.fillRect(0,0,W,H);brand(true,'ITパスポートを、勉強しているあなたへ');
if(t<4){smallLabel('その努力に、手ごたえはありますか。',105,285,true);alpha(ease(t/.7),()=>title(['参考書を読んだ。'],105,410,75,'#fff'));alpha(ease((t-1.4)/.7),()=>title(['過去問も解いた。'],105,530,75,'#fff'));}
else{alpha(ease((t-4)/.55),()=>{text('でも——',105,290,40,MINT);title(['本当に、','理解できていますか？'],105,435,76,'#fff');line(105,610,845,610,MINT,5);text('正解できる。けれど、自信がない。',105,690,32,'#d9e1ed',400)})}}
function terminology(t){bg(true,t);brand(true,'01 / 分からない');const u=t-8;const terms=[['TCP/IP',160,240,76],['正規化',1290,240,75],['公開鍵暗号方式',1030,680,58],['仮想化',240,690,64]];terms.forEach(([s,a,b,z],i)=>alpha(ease((u-i*.4)/.8)*.8,()=>shift(Math.sin(u*.5+i)*15,Math.cos(u*.6+i)*12,()=>{box(a-35,b-65,s.length*z*.72+90,130,18,'#1d3048','#334761');text(s,a,b,z,'#c8d3e3',500)})));alpha(ease((u-1.1)/.8),()=>{box(340,370,1240,218,28,'#101c30ed');text('文字だけでは、イメージできない。',960,460,61,'#fff',700,'center');});x.textAlign='left';}
function network(t){bg(true,t);brand(true,'01 / 分からない');smallLabel('暗記した言葉を、仕組みのイメージへ。',105,202,true);title(['「パケット」を、見てみると。'],105,290,68,'#fff');const u=t-15;const a=[340,960,1580];line(a[0]+100,560,a[2]-100,560,'#3c526c',7);for(let i=0;i<3;i++){box(a[i]-108,448,216,210,28,'#213a54','#49657b');if(i===1){box(a[i]-58,506,116,62,12,MINT);for(let k=0;k<3;k++)circle(a[i]-30+k*30,547,5,INK);line(a[i]-36,507,a[i]-51,478,MINT,5);line(a[i]+36,507,a[i]+51,478,MINT,5)}else{box(a[i]-60,492,120,83,8,null,'#afcbec');line(a[i],575,a[i],600,'#afcbec',5);line(a[i]-35,600,a[i]+35,600,'#afcbec',5)}text(['あなたの端末','ルーター','相手の端末'][i],a[i],706,34,'#dce7f4',500,'center')}
for(let i=0;i<3;i++){let q=clamp((u-.8-i*.65)/3.8);if(u>.8+i*.65){const p=470+q*980;box(p-33,531,66,58,9,MINT);text(String(i+1),p,560,28,INK,700,'center')}}alpha(ease((u-3)/.8),()=>text('小さく分ける → 経路を通る → 元に戻す',960,835,37,MINT,500,'center'))}
function uncertainty(t){bg(true,t);brand(true,'02 / 迷う');const u=t-22;if(t<28){smallLabel('もう一つの、つまずき。',105,220,true);title(['分かりやすい。','それだけで、','次に進めますか？'],105,365,84,'#fff',135);alpha(ease((u-1)/.7),()=>{circle(1450,500,170,'#243950');text('？',1450,495,180,MINT,500,'center')})}else{smallLabel('自分の理解状態が見えないと、',105,205,true);title(['次に何をするか、決められない。'],105,300,69,'#fff');const options=[['この分野は、もう大丈夫？',145,445,700],['復習した方がいい？',1020,420,700],['過去問に進んでいい？',340,650,700],['試験まで、間に合う？',1110,680,630]];options.forEach(([s,a,b,w],i)=>alpha(ease((t-28-i*.45)/.65),()=>shift(0,Math.sin(t+i)*8,()=>{box(a,b,w,130,23,'#23374e','#41566e');text(s,a+35,b+65,38,'#e7edf6',500)})))}}
function pivot(t){bg(false,t);brand(false,'勉強のやり方を、変えよう。');const u=t-35;for(let i=0;i<5;i++){alpha(clamp(1-u/2.5)*.5,()=>shift((i-2)*u*140,-u*65,()=>{box(400+i*225,220,180,470,15,'#d4deef');text('教材',490+i*225,450,36,'#8090a9',600,'center')}))}alpha(ease((u-.5)/1.0),()=>{smallLabel('必要なのは、',105,270);title(['教材を増やすことではない。'],105,380,78);alpha(ease((u-2.5)/.8),()=>{pill('理解できる',105,555,400,BLUE);text('＋',570,584,52,BLUE,400,'center');pill('次の学習を判断できる',645,555,640,INK);text('この2つを、ひと続きに。',105,760,46,INK,500)})})}
function solution(t){bg(false,t);const u=t-42;const mode=t<50?'learn':t<56?'quiz':t<62?'progress':'today';const map={learn:['01','理解する','難しい概念が、','イメージに変わる。','図解とアニメーションで。'],quiz:['02','測る','「覚えた」から、','「理解した」へ。','初見問題などで理解を確認。'],progress:['','現在地を見る','できることと、','足りないことが見える。','Progressで、理解の状態を確認。'],today:['03','次を決める','今日やることが、','もう決まっている。','学習データから、次の一歩へ。']}[mode];brand(false,'理解する → 測る → 次を決める');smallLabel(map[0]?`STEP ${map[0]} / ${map[1]}`:map[1],90,190);title([map[2],map[3]],90,310,55,INK,88);text(map[4],90,525,28,'#617085',500);let im=img.packet;let a=740,b=180,w=1080,h=735;
if(mode==='learn'){im=img['packet-'+Math.min(5,Math.floor((t-42)/1.35))]||img.packet;box(a,b,w,h,23,'#fff','#dbe2eb');imageFit(im,a+30,b+75,w-60,h-120);text('データは「パケット」で運ぶ',a+45,b+40,30,INK,600);alpha(ease((u-.4)/.8),()=>{imageFit(img.mochit,155,625,230,230);box(350,665,310,75,25,'#fff');text('仕組みが見えた！',505,703,26,BLUE,600,'center')})}
if(mode==='quiz'){im=t<53.2?img.quiz:img['quiz-answer'];box(a,b,w,h,23,'#fff','#dbe2eb');imageFit(im,a+30,b+25,w-60,h-50);if(t>53.2){pill('理解を、確かめる。',105,635,500,'#ddf2eb','#24785e')}}
if(mode==='progress'){device(img.progress,a,b,w,h,0,930,240,1200);pill('学習例：合格準備度 68 / 100',90,635,585,'#e5ebf9',BLUE)}
if(mode==='today'){device(img.today,a,b,w,h,0,1000,240,1200);imageFit(img.mochit,140,630,220,220);box(330,665,330,75,25,'#fff');text('今日はここから。',495,703,28,BLUE,600,'center')}
text('実際のサービス画面 / 撮影用の学習データ',1815,946,22,'#65748a',400,'right')}
function core(t){bg(false,t);brand(false,'学習のサイクル');smallLabel('あとは、このサイクルを合格まで。',105,195);title(['理解する。測る。次を決める。'],105,295,77);const u=t-68;const xs=[340,890,1440];for(let i=0;i<3;i++){if(i<2)arrow(xs[i]+175,535,xs[i+1]-175,535,'#98add3');const active=Math.floor(u/2)%3===i;box(xs[i]-185,435,370,205,28,active?BLUE:'#fff',active?BLUE:'#d6deed');text(`0${i+1}`,xs[i]-145,475,24,active?'#bcccff':BLUE,500);text(['理解する','測る','次を決める'][i],xs[i],550,49,active?'#fff':INK,700,'center')}
x.beginPath();x.moveTo(1440,666);x.bezierCurveTo(1440,760,340,760,340,666);x.strokeStyle='#92a9d0';x.lineWidth=3;x.stroke();arrow(340,690,340,666,'#92a9d0');
const score=Math.round(68+8*ease((u-1)/7));box(455,790,1010,118,25,'#e5edf9');text('合格準備度',500,845,30,'#526583',500);text('68',940,845,39,'#8b9bb1',500);arrow(1000,845,1105,845,BLUE);text(String(score),1210,845,69,BLUE,600,'center');text('/ 100',1315,860,30,'#617085',500);text('数値は変化のイメージです。合格可能性や効果を保証するものではありません。',960,947,21,'#67758a',400,'center')}
function closing(t){bg(false,t);brand(false,'ITパスポート学習コーチ');let u=t-78;if(t<85){smallLabel('勉強した量より、理解できた手ごたえを。',105,215);title(['「分からない」と','「迷う」をなくして、'],105,350,86,INK,126);alpha(ease((u-1.8)/.8),()=>{text('合格まで。',105,647,118,BLUE,700);line(105,728,720,728,BLUE,7)});imageFit(img.mochit,1260,365,410,410);alpha(ease((u-2.3)/.8),()=>{box(1170,240,570,90,28,'#fff');text('次の一歩が、分かる。',1455,285,35,BLUE,600,'center')})}else{alpha(ease((t-85)/.6),()=>{imageFit(img.mochit,838,125,244,244);text('it-learning-app',960,451,100,INK,700,'center');text('ITパスポート学習コーチ',960,557,35,'#617085',500,'center');pill('今日の一歩を、ここから。',565,670,790,BLUE);text('shikaku-mochit.com',960,817,36,INK,500,'center');text('VOICEVOX：春日部つむぎ',960,926,21,'#6b7888',400,'center')})}}
window.render=(t)=>{x.clearRect(0,0,W,H);x.textAlign='left';if(t<8)opening(t);else if(t<15)terminology(t);else if(t<22)network(t);else if(t<35)uncertainty(t);else if(t<42)pivot(t);else if(t<68)solution(t);else if(t<78)core(t);else closing(t);sub(t);const cuts=[8,15,22,28,35,42,50,56,62,68,78,85];const cut=cuts.find(v=>Math.abs(t-v)<.15);if(cut!==undefined){alpha((1-Math.abs(t-cut)/.15)*.35,()=>{x.fillStyle=t<35?INK:CREAM;x.fillRect(0,0,W,H)})}return true};
window.ready=(async()=>{story=await(await fetch('story.json')).json();await Promise.all(['student','mochit','today','progress','packet','quiz','quiz-answer',...Array.from({length:6},(_,i)=>'packet-'+i)].map(async name=>{const im=new Image();im.src='assets/'+name+(name==='mochit'?'.webp':'.png');await new Promise(resolve=>{im.onload=resolve;im.onerror=resolve});if(im.naturalWidth)img[name]=im;}));await document.fonts.ready;render(0);return true})();
</script>
